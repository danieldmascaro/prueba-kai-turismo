<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interfaz Prueba</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
        (async () => {
            const url = 'https://raw.githubusercontent.com/Turistik-Chile/plugin-chat-kai/refs/heads/master/main.js';
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) {
                throw new Error(`No se pudo cargar el script: ${res.status} ${res.statusText}`);
            }
            const code = await res.text();
            const blob = new Blob([code], { type: 'text/javascript' });
            const blobUrl = URL.createObjectURL(blob);
            const script = document.createElement('script');
            script.src = blobUrl;
            script.onload = () => URL.revokeObjectURL(blobUrl);
            document.head.appendChild(script);
        })().catch((err) => {
            console.error('Error cargando script remoto:', err);
        });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
